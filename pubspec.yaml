name: liquid_glass_nav_bar
description: >-
  An iOS 26 "Liquid Glass" floating tab bar for Flutter. It has a frosted blur,
  shrinks on scroll, and has a draggable lens indicator that springs between
  tabs. Pure Dart, with RTL support.
version: 0.1.0
# TODO: point these at your real repository before publishing.
homepage: https://github.com/your-org/liquid_glass_nav_bar
repository: https://github.com/your-org/liquid_glass_nav_bar
issue_tracker: https://github.com/your-org/liquid_glass_nav_bar/issues
topics:
  - navigation
  - bottom-navigation-bar
  - glassmorphism
  - ios
  - animation

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

screenshots:
  - description: The dark bar floating over a photo feed.
    path: doc/screenshot_dark.png
